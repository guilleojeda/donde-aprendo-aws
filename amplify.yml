version: 1
frontend:
  phases:
    preBuild:
      commands:
        - NVM_NODEJS_ORG_MIRROR=https://nodejs.org/download/release nvm install "$(cat .nvmrc)"
        - nvm use "$(cat .nvmrc)"
        - npm ci
        - test -n "$ACCOUNT_ORIGIN" && test -n "$COGNITO_ISSUER" && test -n "$COGNITO_CLIENT_ID" && test -n "$COGNITO_DOMAIN" && test -n "$ACCOUNTS_TABLE" && test -n "$CATALOG_TABLE" && test -n "$CREATOR_PROFILES_TABLE" && test -n "$CREATOR_PHOTOS_BUCKET"
        - npm run check
        - npm test
    build:
      commands:
        - npm run build
        - npm run verify:blog
        - npm run verify:site
        - npm prune --omit=dev
        - mv node_modules ./.amplify-hosting/compute/default/node_modules
        - npm run verify:hosting
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
