version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install "$(cat .nvmrc)"
        - nvm use "$(cat .nvmrc)"
        - npm ci
        - npm run check
        - npm test
    build:
      commands:
        - npm run build
        - npm run verify:blog
        - npm run verify:site
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
