name: Verify site
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run package:submission
      - run: npm run smoke:submission
      - run: npm run build
        env:
          CATALOG_FIXTURE: tests/fixtures/catalog.json
          PUBLIC_SUBMISSION_API_URL: https://api.example.invalid/submissions
      - run: npm run verify:blog
      - run: npm run verify:site
      - run: npm run build
        env:
          CATALOG_FIXTURE: tests/fixtures/catalog.json
          PUBLIC_SUBMISSION_API_URL: https://api.example.invalid/submissions
          PUBLIC_PRODUCTION: 'true'
          PUBLIC_SITE_ORIGIN: https://dondeaprendoaws.com
      - run: npm run verify:blog
        env:
          PUBLIC_PRODUCTION: 'true'
          PUBLIC_SITE_ORIGIN: https://dondeaprendoaws.com
      - run: npm run verify:site
        env:
          PUBLIC_PRODUCTION: 'true'
