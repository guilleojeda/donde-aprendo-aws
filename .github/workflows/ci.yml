name: Verify site
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      # Hosted Ubuntu supplies Chromium libraries; application fonts are bundled.
      - run: npx playwright install chromium
      - run: npm run test:browser
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: creator-browser-diagnostics
          path: |
            playwright-report/creator-browser/
            test-results/creator-browser/
          if-no-files-found: ignore
          retention-days: 7
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: npm run package:submission
      - run: npm run smoke:submission
      - run: npm run package:publication
      - run: python3 scripts/package-meetup-events.py
      - run: npm run package:password-reset
      - name: Prepare enriched directory fixture
        run: node tests/fixtures/compact-directory-catalog.mjs > "$RUNNER_TEMP/compact-directory-catalog.json"
      - run: node --test tests/built-release-command.mjs
      - run: npm run build
        env:
          CATALOG_FIXTURE: ${{ runner.temp }}/compact-directory-catalog.json
          RELEASE_CONTEXT_FILE: tests/fixtures/release-preview-context.json
          PUBLIC_SUBMISSION_API_URL: https://api.example.invalid/submissions
          PUBLIC_PRODUCTION: 'false'
          PUBLIC_SITE_ORIGIN: https://main.d33kh9d3cyassq.amplifyapp.com
          ACCOUNT_ORIGIN: https://dondeaprendoaws.com
          COGNITO_ISSUER: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_EXAMPLE
          COGNITO_CLIENT_ID: example-client-id
          COGNITO_DOMAIN: https://example.auth.us-east-1.amazoncognito.com
          ACCOUNTS_TABLE: example-accounts
          CREATOR_PROFILES_TABLE: example-profiles
          CREATOR_PHOTOS_BUCKET: example-photos
      - run: npm run verify:blog
        env:
          RELEASE_CONTEXT_FILE: tests/fixtures/release-preview-context.json
          PUBLIC_SUBMISSION_API_URL: https://api.example.invalid/submissions
          PUBLIC_PRODUCTION: 'false'
          PUBLIC_SITE_ORIGIN: https://main.d33kh9d3cyassq.amplifyapp.com
      - run: npm run verify:site
        env:
          DIRECTORY_ACCEPTANCE_FIXTURE_MODE: enriched
          RELEASE_CONTEXT_FILE: tests/fixtures/release-preview-context.json
          PUBLIC_SUBMISSION_API_URL: https://api.example.invalid/submissions
          PUBLIC_PRODUCTION: 'false'
          PUBLIC_SITE_ORIGIN: https://main.d33kh9d3cyassq.amplifyapp.com
      - name: Verify preview generated output independently
        run: node --test tests/built-deployment-context.mjs
        env:
          RELEASE_CONTEXT_FILE: tests/fixtures/release-preview-context.json
      - run: npm prune --omit=dev
      - run: mv node_modules ./.amplify-hosting/compute/default/node_modules
      - name: Verify packaged preview and runtime boundary
        run: node --test tests/built-release-contract.mjs && npm run verify:preview
        env:
          RELEASE_CONTEXT_FILE: tests/fixtures/release-preview-context.json
          ACCOUNT_ORIGIN: https://dondeaprendoaws.com
      - run: mv ./.amplify-hosting/compute/default/node_modules ./node_modules
      - run: npm ci
      - name: Build through the production-shaped catalog SDK fixture
        run: node tests/fixtures/hosting-release-dynamodb.mjs --catalog "$RUNNER_TEMP/compact-directory-catalog.json" --release-context tests/fixtures/release-production-context.json -- npm run build
      - run: npm run verify:blog
        env:
          RELEASE_CONTEXT_FILE: tests/fixtures/release-production-context.json
          PUBLIC_SUBMISSION_API_URL: https://api.example.invalid/submissions
          PUBLIC_PRODUCTION: 'true'
          PUBLIC_SITE_ORIGIN: https://dondeaprendoaws.com
      - run: npm run verify:site
        env:
          DIRECTORY_ACCEPTANCE_FIXTURE_MODE: enriched
          RELEASE_CONTEXT_FILE: tests/fixtures/release-production-context.json
          PUBLIC_SUBMISSION_API_URL: https://api.example.invalid/submissions
          PUBLIC_PRODUCTION: 'true'
          PUBLIC_SITE_ORIGIN: https://dondeaprendoaws.com
      - name: Verify production-shaped generated output
        run: node --test tests/built-deployment-context.mjs
        env:
          RELEASE_CONTEXT_FILE: tests/fixtures/release-production-context.json
      - run: npm prune --omit=dev
      - run: mv node_modules ./.amplify-hosting/compute/default/node_modules
      - name: Verify packaged production-shaped release
        run: npm run verify:hosting && node --test tests/built-release-contract.mjs && npm run verify:preview
        env:
          RELEASE_CONTEXT_FILE: tests/fixtures/release-production-context.json
          ACCOUNT_ORIGIN: https://dondeaprendoaws.com
