name: Verify site
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: npm run package:submission
      - run: npm run smoke:submission
      - run: npm run package:publication
      - run: python3 scripts/package-meetup-events.py
      - run: npm run package:password-reset
      - name: Prepare enriched directory fixture
        run: node tests/fixtures/compact-directory-catalog.mjs > "$RUNNER_TEMP/compact-directory-catalog.json"
      - run: npm run build
        env:
          CATALOG_FIXTURE: ${{ runner.temp }}/compact-directory-catalog.json
          PUBLIC_SUBMISSION_API_URL: https://api.example.invalid/submissions
          PUBLIC_PRODUCTION: 'false'
          PUBLIC_SITE_ORIGIN: https://main.d33kh9d3cyassq.amplifyapp.com
          ACCOUNT_ORIGIN: https://dondeaprendoaws.com
          COGNITO_ISSUER: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_EXAMPLE
          COGNITO_CLIENT_ID: example-client-id
          COGNITO_DOMAIN: https://example.auth.us-east-1.amazoncognito.com
          ACCOUNTS_TABLE: example-accounts
          CREATOR_PROFILES_TABLE: example-profiles
          CREATOR_PHOTOS_BUCKET: example-photos
          GA4_PROPERTY_ID: '123456789'
          GA4_CREDENTIALS_SECRET_ARN: 'arn:aws:secretsmanager:us-east-1:000000000000:secret:creator-statistics-ci-placeholder-abcdef'
          CREATOR_ANALYTICS_CAPTURE_STARTED_AT: '2000-01-01T00:00:00.000Z'
      - run: npm run verify:blog
        env:
          PUBLIC_PRODUCTION: 'false'
          PUBLIC_SITE_ORIGIN: https://main.d33kh9d3cyassq.amplifyapp.com
      - run: npm run verify:site
        env:
          DIRECTORY_ACCEPTANCE_FIXTURE_MODE: enriched
          PUBLIC_PRODUCTION: 'false'
          PUBLIC_SITE_ORIGIN: https://main.d33kh9d3cyassq.amplifyapp.com
      - run: npm run build
        env:
          CATALOG_FIXTURE: ${{ runner.temp }}/compact-directory-catalog.json
          PUBLIC_SUBMISSION_API_URL: https://api.example.invalid/submissions
          PUBLIC_PRODUCTION: 'true'
          PUBLIC_SITE_ORIGIN: https://dondeaprendoaws.com
          ACCOUNT_ORIGIN: https://dondeaprendoaws.com
          COGNITO_ISSUER: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_EXAMPLE
          COGNITO_CLIENT_ID: example-client-id
          COGNITO_DOMAIN: https://example.auth.us-east-1.amazoncognito.com
          ACCOUNTS_TABLE: example-accounts
          CREATOR_PROFILES_TABLE: example-profiles
          CREATOR_PHOTOS_BUCKET: example-photos
          GA4_PROPERTY_ID: '123456789'
          GA4_CREDENTIALS_SECRET_ARN: 'arn:aws:secretsmanager:us-east-1:000000000000:secret:creator-statistics-ci-placeholder-abcdef'
          CREATOR_ANALYTICS_CAPTURE_STARTED_AT: '2000-01-01T00:00:00.000Z'
      - run: npm run verify:blog
        env:
          PUBLIC_PRODUCTION: 'true'
          PUBLIC_SITE_ORIGIN: https://dondeaprendoaws.com
      - run: npm run verify:site
        env:
          DIRECTORY_ACCEPTANCE_FIXTURE_MODE: enriched
          PUBLIC_PRODUCTION: 'true'
          PUBLIC_SITE_ORIGIN: https://dondeaprendoaws.com
      - run: npm prune --omit=dev
      - run: mv node_modules ./.amplify-hosting/compute/default/node_modules
      - run: npm run verify:hosting
      - run: npm run verify:preview
