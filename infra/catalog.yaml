AWSTemplateFormatVersion: '2010-09-09'
Description: Directory catalog, Amplify build access, and deployment artifacts
Resources:
  Catalog:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: donde-aprendo-aws-catalog
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: Project
          Value: donde-aprendo-aws
  AmplifyBuildRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Read published directory content during an Amplify static build
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: amplify.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: ReadCatalog
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Scan
                Resource: !GetAtt Catalog.Arn
                Condition:
                  ForAllValues:StringEquals:
                    dynamodb:Attributes:
                      - id
                      - title
                      - url
                      - description
                      - category
                      - order
                      - featured
                      - kind
                      - format
                      - topics
                      - addedAt
                      - country
                      - level
                      - sourceId
                      - communityId
                      - published
                  StringEquals:
                    dynamodb:Select: SPECIFIC_ATTRIBUTES
      Tags:
        - Key: Project
          Value: donde-aprendo-aws
  DeploymentArtifacts:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: donde-aprendo-aws
Outputs:
  CatalogTable:
    Value: !Ref Catalog
  AmplifyBuildRoleArn:
    Value: !GetAtt AmplifyBuildRole.Arn
  DeploymentArtifactsBucket:
    Value: !Ref DeploymentArtifacts
